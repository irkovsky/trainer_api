{% extends 'base.html' %}

{% block title %}Удалить тренировку{% endblock %}

{% block content %}
    <h1>Удалить тренировку?</h1>
    
    <p>Вы уверены, что хотите удалить:</p>
    <p><strong>{{ workout.title }}</strong> ({{ workout.date }})</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'workout_detail' workout.pk %}">Отмена</a>
    </form>
{% endblock %}
