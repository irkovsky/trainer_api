{% extends 'base.html' %}

{% block title %}Удалить анализ{% endblock %}

{% block content %}
    <h1>Удалить анализ?</h1>
    
    <p>Вы уверены, что хотите удалить:</p>
    <p><strong>{{ analysis.title }}</strong> ({{ analysis.date }})</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'analysis_detail' analysis.pk %}">Отмена</a>
    </form>
{% endblock %}
